{% extends "base.html" %}
{% block title %}Lupa Password - Scorpio{% endblock %}

{% block content %}
<section class="card auth-card">
    <h1>Lupa Password?</h1>
    <p class="muted">
        Masukkan email yang terhubung dengan akunmu untuk meminta kode OTP.
    </p>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Email</label>
        <input type="email" name="email" required
               autocomplete="email"
               placeholder="nama@gmail.com">

        <button type="submit">Kirim Kode OTP</button>
    </form>

    <p class="center">
        <a href="{{ url_for('login') }}">Kembali ke Login</a>
    </p>
</section>
{% endblock %}
